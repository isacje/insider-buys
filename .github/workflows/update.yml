name: Update insider data

on:
  schedule:
    # 7:15am New York time (11:15 UTC; 6:15am during winter), Tuesday-Saturday,
    # after SEC publishes the previous business day's index
    - cron: "15 11 * * 2-6"
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (use 35 for the first run)"
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch new Form 4 filings from SEC
        id: fetch
        continue-on-error: true  # keep whatever days were downloaded
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pipeline.run update --days ${{ github.event.inputs.days || '7' }}

      - name: Save new filing days to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days
          git diff --cached --quiet || git commit -m "Add insider filings through $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push

      - name: Build website data
        run: python -m pipeline.run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Flag a failed download
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::The SEC download step failed. Days fetched before the failure were saved and published; see the 'Fetch' step log."
          exit 1
